<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Washroom</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; overscroll-behavior: none; }
  body {
    display: grid;
    place-items: center;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  svg { width: min(70vmin, 70vmax); height: auto; }
  #needle {
    transition: transform .35s cubic-bezier(.22, 1, .36, 1);
    transform-origin: 150px 150px;
  }
  #arrow { opacity: .16; transition: opacity .6s ease; }
  #arrow.live { opacity: 1; }
  .hide { display: none; }
  @media (prefers-reduced-motion: reduce) { #needle { transition: none; } }
</style>
</head>
<body>

<svg id="arrow" viewBox="0 0 300 300">
  <g id="needle">
    <polygon points="150,30 180,185 150,163 120,185" fill="#fff"/>
  </g>
</svg>

<svg id="sad" class="hide" viewBox="0 0 300 300" stroke="#fff" stroke-width="12"
     stroke-linecap="round" fill="none">
  <circle cx="150" cy="150" r="120"/>
  <line x1="110" y1="120" x2="110" y2="122"/>
  <line x1="190" y1="120" x2="190" y2="122"/>
  <path d="M105 205 Q150 170 195 205"/>
</svg>

<svg id="tick" class="hide" viewBox="0 0 300 300" stroke="#22c55e" stroke-width="24"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
  <path d="M70 155 L125 210 L230 95"/>
</svg>

<script>
(function () {
  'use strict';

  var R = 6371000;
  var rad = function (d) { return d * Math.PI / 180; };
  var deg = function (r) { return r * 180 / Math.PI; };

  function distance(a, b) {
    var dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
    var h = Math.pow(Math.sin(dLat / 2), 2) +
            Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.pow(Math.sin(dLon / 2), 2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  function bearing(a, b) {
    var dLon = rad(b.lon - a.lon);
    var y = Math.sin(dLon) * Math.cos(rad(b.lat));
    var x = Math.cos(rad(a.lat)) * Math.sin(rad(b.lat)) -
            Math.sin(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.cos(dLon);
    return (deg(Math.atan2(y, x)) + 360) % 360;
  }

  function makeSmoother(alpha) {
    var x = null, y = null;
    return function (d) {
      var r = rad(d), cx = Math.cos(r), cy = Math.sin(r);
      x = x === null ? cx : x + alpha * (cx - x);
      y = y === null ? cy : y + alpha * (cy - y);
      return (deg(Math.atan2(y, x)) + 360) % 360;
    };
  }

  var arrow = document.getElementById('arrow');
  var needleEl = document.getElementById('needle');
  var sad = document.getElementById('sad');
  var tick = document.getElementById('tick');

  var OUT_OF_RANGE = 20000;
  var CUSTOMER_PENALTY = 200;

  var all = null;
  var ranked = [];
  var pick = 0;
  var pos = null;
  var heading = 0;
  var turned = 0;
  var hits = 0;
  var running = false;
  var over = false;
  var smooth = makeSmoother(0.2);
  var wakeLock = null;

  function show(el) {
    over = true;
    arrow.classList.add('hide');
    el.classList.remove('hide');
  }

  function reset() {
    over = false;
    sad.classList.add('hide');
    tick.classList.add('hide');
    arrow.classList.remove('hide');
  }

  function draw() {
    if (over || !pos || !ranked.length) return;
    var target = ranked[pick];

    arrow.classList.add('live');

    var delta = ((bearing(pos, target) - heading - turned) % 360 + 540) % 360 - 180;
    turned += delta;
    needleEl.style.transform = 'rotate(' + turned + 'deg)';

    var d = distance(pos, target);
    hits = d < Math.max(15, Math.min(pos.acc, 30)) ? hits + 1 : 0;
    if (hits >= 3) show(tick);
  }

  function load() {
    if (all) return Promise.resolve(all);
    return fetch('toilets.json', { cache: 'default' })
      .then(function (res) {
        if (!res.ok) throw new Error('toilets.json ' + res.status);
        return res.json();
      })
      .then(function (json) {
        all = json.toilets.map(function (t) {
          return { lat: t[0], lon: t[1], customers: !!t[2], fee: !!t[3], name: t[4] };
        });
        return all;
      });
  }

  function rank(from) {
    return all
      .map(function (t) {
        var d = distance(from, t);
        return { t: t, score: d + (t.customers ? CUSTOMER_PENALTY : 0), d: d };
      })
      .sort(function (a, b) { return a.score - b.score; })
      .map(function (x) { return x.t; });
  }

  function startCompass() {
    var DOE = window.DeviceOrientationEvent;
    var ready = (DOE && typeof DOE.requestPermission === 'function')
      ? DOE.requestPermission()
      : Promise.resolve('granted');

    return ready.then(function (state) {
      if (state !== 'granted') return;
      var evt = ('ondeviceorientationabsolute' in window)
        ? 'deviceorientationabsolute'
        : 'deviceorientation';
      window.addEventListener(evt, function (e) {
        var h = null;
        if (typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;
        else if (e.absolute && typeof e.alpha === 'number') h = (360 - e.alpha) % 360;
        if (h === null) return;
        heading = smooth(h);
        draw();
      }, true);
    }).catch(function () {});
  }

  function firstFix() {
    return new Promise(function (resolve, reject) {
      if (!navigator.geolocation) return reject(new Error('no geolocation'));
      navigator.geolocation.getCurrentPosition(
        function (p) {
          resolve({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy });
        },
        reject,
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
      );
    });
  }

  function watch() {
    navigator.geolocation.watchPosition(function (p) {
      pos = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy };
      draw();
    }, function () {},
       { enableHighAccuracy: true, maximumAge: 3000, timeout: 20000 });
  }

  function keepAwake() {
    if (!navigator.wakeLock) return;
    navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; })
      .catch(function () {});
  }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && running && !over) keepAwake();
  });

  function go() {
    if (running) return;
    running = true;
    reset();
    startCompass();
    keepAwake();

    Promise.all([load(), firstFix()]).then(function (r) {
      pos = r[1];
      ranked = rank(pos);
      pick = 0;
      if (!ranked.length || distance(pos, ranked[0]) > OUT_OF_RANGE) {
        running = false;
        return show(sad);
      }
      watch();
      draw();
    }).catch(function () {
      running = false;
      show(sad);
    });
  }

  var lastTap = 0;
  document.addEventListener('click', function () {
    var now = Date.now();
    var quick = now - lastTap < 400;
    lastTap = now;

    if (!running) return go();
    if (over) { running = false; return go(); }
    if (quick && pick < ranked.length - 1) {
      pick++;
      hits = 0;
      draw();
    }
  });
})();
</script>

</body>
</html>
